[package]
name = "solquest"
version = "0.1.0"
description = "SolQuest: Unified Solana Program (Counter, PDA Profiles, SPL Rewards)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solquest"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["metadata"] }
solana-program = "~1.18"
