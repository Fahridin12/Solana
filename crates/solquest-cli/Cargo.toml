[package]
name = "solquest-cli"
version = "0.1.0"
edition = "2021"
description = "SolQuest CLI: Rust CLI tool demonstrating essential Solana concepts (PDA derivation, Borsh, RPC, Signers)"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
solana-client = "1.18"
solana-sdk = "1.18"
solana-account-decoder = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3.0", features = ["no-entrypoint"] }
borsh = "0.10"
borsh-derive = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
colored = "2.1"
shellexpand = "3.1"
